<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Historico da Frota - SESMA</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; color: #222; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitulo { color: #666; font-size: 13px; margin-bottom: 20px; }
  .painel { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 16px; margin-bottom: 20px; }
  .linha-filtros { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .campo { display: flex; flex-direction: column; gap: 4px; }
  .campo label { font-size: 12px; color: #555; }
  select, input, button { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  button { background: #1a5fa8; color: #fff; border: none; cursor: pointer; padding: 8px 16px; }
  button:hover { background: #144a85; }
  button.secundario { background: #fff; color: #1a5fa8; border: 1px solid #1a5fa8; }
  button.secundario:hover { background: #f0f6fc; }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { border: 1px solid #ddd; padding: 8px; font-size: 13px; text-align: left; }
  th { background: #eef2f7; }
  .status-ativo { color: #1a7a3c; }
  .status-baixado { color: #b02a2a; }
  .status-substituido { color: #b07a1a; }
  .vazio { padding: 30px; text-align: center; color: #888; }
  @media print {
    .painel-filtros, button { display: none; }
  }
</style>
</head>
<body>

<h1>Historico da Frota</h1>
<div class="subtitulo">SESMA - Divisao de Servicos Gerais / Setor de Transportes</div>

<div class="painel painel-filtros">
  <div class="linha-filtros">
    <div class="campo">
      <label>Mes</label>
      <select id="filtroMes"></select>
    </div>
    <div class="campo">
      <label>Ano</label>
      <select id="filtroAno"></select>
    </div>
    <div class="campo">
      <label>Placa (opcional, historico individual)</label>
      <input type="text" id="filtroPlaca" placeholder="Ex: ABC1234">
    </div>
    <button onclick="buscar()">Buscar</button>
    <button class="secundario" onclick="window.print()">Imprimir</button>
    <button class="secundario" onclick="exportarExcel()">Exportar Excel</button>
  </div>
</div>

<div class="painel">
  <table id="tabelaHistorico">
    <thead>
      <tr>
        <th>Placa</th>
        <th>Condutor</th>
        <th>Periodo</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="corpoTabela"></tbody>
  </table>
  <div class="vazio" id="mensagemVazia" style="display:none;">Nenhum registro encontrado para o filtro selecionado.</div>
</div>

<script>
  // ATENCAO: preencher com a mesma URL e chave anon que o sistema principal ja usa
  const SUPABASE_URL = 'https://xmcenpowfsszvaoichou.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtY2VucG93ZnNzenZhb2ljaG91Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyNzcxMDksImV4cCI6MjA5Mjg1MzEwOX0.xqrckYrWmnuZLygz-6XeGtWjPqlrKwm0OY_fGVu8fg4';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const meses = ['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  function preencherFiltros() {
    const selMes = document.getElementById('filtroMes');
    meses.forEach((m, i) => {
      const opt = document.createElement('option');
      opt.value = i + 1;
      opt.textContent = m;
      selMes.appendChild(opt);
    });
    const hoje = new Date();
    selMes.value = hoje.getMonth() + 1;

    const selAno = document.getElementById('filtroAno');
    const anoAtual = hoje.getFullYear();
    for (let a = anoAtual; a >= anoAtual - 5; a--) {
      const opt = document.createElement('option');
      opt.value = a;
      opt.textContent = a;
      selAno.appendChild(opt);
    }
  }

  function formatarData(strData) {
    if (!strData) return 'atual';
    const [ano, mes, dia] = strData.split('-');
    return dia + '/' + mes;
  }

  function statusTexto(registro) {
    if (registro.status === 'Substituido') {
      return '<span class="status-substituido">Substituido por ' + (registro.placa_substituta || '-') + '</span>';
    }
    if (registro.status === 'Baixado') {
      return '<span class="status-baixado">Baixado' + (registro.motivo_saida ? ' - ' + registro.motivo_saida : '') + '</span>';
    }
    return '<span class="status-ativo">Ativo</span>';
  }

  async function consultarHistoricoMes(ano, mes) {
    const inicioMes = ano + '-' + String(mes).padStart(2, '0') + '-01';
    const ultimoDia = new Date(ano, mes, 0).getDate();
    const fimMes = ano + '-' + String(mes).padStart(2, '0') + '-' + ultimoDia;

    const { data, error } = await supabase
      .from('historico_veiculos')
      .select('*')
      .lte('data_inicio', fimMes)
      .or('data_fim.gte.' + inicioMes + ',data_fim.is.null')
      .order('placa', { ascending: true })
      .order('data_inicio', { ascending: true });

    if (error) {
      console.error('Erro ao consultar historico do mes:', error);
      return [];
    }
    return data;
  }

  async function consultarHistoricoVeiculo(placa) {
    const { data, error } = await supabase
      .from('historico_veiculos')
      .select('*')
      .eq('placa', placa)
      .order('data_inicio', { ascending: true });

    if (error) {
      console.error('Erro ao consultar historico do veiculo:', error);
      return [];
    }
    return data;
  }

  async function buscar() {
    const placa = document.getElementById('filtroPlaca').value.trim().toUpperCase();
    const mes = document.getElementById('filtroMes').value;
    const ano = document.getElementById('filtroAno').value;

    let registros = [];
    if (placa) {
      registros = await consultarHistoricoVeiculo(placa);
    } else {
      registros = await consultarHistoricoMes(ano, mes);
    }

    renderizarTabela(registros);
  }

  function renderizarTabela(registros) {
    const corpo = document.getElementById('corpoTabela');
    const vazio = document.getElementById('mensagemVazia');
    corpo.innerHTML = '';

    if (!registros || registros.length === 0) {
      vazio.style.display = 'block';
      return;
    }
    vazio.style.display = 'none';

    registros.forEach(r => {
      const periodo = formatarData(r.data_inicio) + ' a ' + formatarData(r.data_fim);
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + r.placa + '</td>' +
                     '<td>' + (r.condutor || '-') + '</td>' +
                     '<td>' + periodo + '</td>' +
                     '<td>' + statusTexto(r) + '</td>';
      corpo.appendChild(tr);
    });
  }

  function exportarExcel() {
    const tabela = document.getElementById('tabelaHistorico');
    let csv = [];
    tabela.querySelectorAll('tr').forEach(linha => {
      const linhaTexto = [...linha.querySelectorAll('th, td')].map(c => '"' + c.innerText.replace(/"/g, '""') + '"');
      csv.push(linhaTexto.join(';'));
    });
    const blob = new Blob([csv.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'historico_frota.csv';
    link.click();
  }

  preencherFiltros();
  buscar();
</script>

</body>
</html>
